name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  react-compatibility:
    strategy:
      matrix:
        react: [18.3.1, 19.2.8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@beetroot11/repocanvas
      - run: npm pack --workspace=@beetroot11/repocanvas --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install and import with React ${{ matrix.react }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir "consumer-${{ matrix.react }}"
          cd "consumer-${{ matrix.react }}"
          npm init -y
          npm install "react@${{ matrix.react }}" "react-dom@${{ matrix.react }}" "@excalidraw/excalidraw@^0.18.1" "$RUNNER_TEMP/beetroot11-repocanvas-0.2.0.tgz"
          node --input-type=module -e "const api = await import('@beetroot11/repocanvas'); if (!api.RepoCanvasEditor || !api.WhiteboardWorkspace) process.exit(1)"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
